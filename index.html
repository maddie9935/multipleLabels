<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swim lesson sign-up (demo)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="inner">
      <a class="site-name" href="index.html">Riverville Community Pool</a>
    </div>
  </header>

  <main id="main">
    <h1>Swim lesson sign-up</h1>
    <p class="lede">Enter your name to join the waitlist for spring swim lessons.</p>

    <form id="signup">
      <!-- Intentional accessibility error: the Last Name input has two labels. Both label elements use for="lastName". -->
      <div class="field">
        <label for="lastName">First Name</label>
        <input type="text" id="firstName">
      </div>
      <div class="field">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName">
      </div>

      <button type="submit">Join the waitlist</button>
      <p class="status" role="status"></p>
    </form>
  </main>

  <script>
    document.getElementById("signup").addEventListener("submit", function (e) {
      e.preventDefault();
      this.querySelector(".status").textContent = "You're on the waitlist. This is a demo, so nothing was sent.";
    });
  </script>
</body>
</html>
